name: Dashboard'u GitHub Pages'e Yayinla

# Faz 1 T5 (PeacewAI_Faz_Plani_ve_Is_Bolumu.docx): sunum/demo videosunda
# paylasilabilir, canli bir arayuz URL'si gostermek icin.
#
# ONEMLI - DURUSTLUK NOTU: Pages yalniz STATIK arayuzu yayinlar. Backend
# (FastAPI + Postgres + Qdrant + Ollama) burada CALISMAZ ve calistirilamaz.
# VITE_API_BASE_URL (asagida) bir GitHub degiskeni olarak bos - eger repoya
# bir tane eklenmezse (Settings > Secrets and variables > Actions >
# Variables), yayinlanan site varsayilan olarak localhost:8000'e istek
# atmaya calisir ve dis ziyaretcilerde "Veri alinamadi" hatasi GORUNUR -
# bu bir hata DEGIL, dogru davranistir (uydurma veri gosterilmez, rapor
# Bolum 5.7/15 ile ayni ilke). Canli/calisan veri gosterimi fiziki sunumda
# ekibin kendi bilgisayarindaki backend ile yapilir.
#
# Repo ayarlarinda bir kerelik: Settings > Pages > Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Ayni anda birden fazla deploy calismasin - yariş durumu onlenir.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Bagimliliklari kur
        run: npm ci --prefix dashboard

      - name: Derle (production - /katilim-ai/ on ekiyle)
        run: npm run build --prefix dashboard
        env:
          # Bos birakilirsa client.js localhost:8000'e duser (yukaridaki
          # durustluk notuna bakin). Gercek bir backend adresi olursa
          # repo degiskeni olarak eklenip buraya BASKA HICBIR SEY
          # DEGISTIRMEDEN akacak sekilde tasarlandi.
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Pages icin yapilandir
        uses: actions/configure-pages@v5

      - name: Derleme ciktisini yukle
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Pages'e yayinla
        id: deployment
        uses: actions/deploy-pages@v4
