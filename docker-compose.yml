# KatilimAI - yerel gelistirme ortami
#
# Kullanim:
#   docker compose up -d      -> uc servisi ayaga kaldirir
#   docker ps                 -> calistiklarini dogrular
#   docker compose down       -> durdurur
#
# Sartname Md. 5.9 (on-premise): tum servisler yerelde calisir,
# hicbir dis bulut servisine bagimlilik yoktur.
#
# GUVENLIK NOTU: Asagidaki parola YALNIZCA yerel gelistirme icindir.
# Gercek/disa acik bir kuruluma gecilirse ortam degiskeni (.env) ile
# verilmeli ve repoya konmamalidir.
#
# PORT BAGLAMA: Tum servisler "127.0.0.1:" oneki ile YALNIZCA localhost'a
# baglanir. Onceki halinde ("5432:5432") Docker portu 0.0.0.0'a acar -
# yani ayni agdaki her makine, varsayilan parolayla PostgreSQL'e ve
# kimlik dogrulamasi olmayan Qdrant/Ollama'ya erisebilirdi. Yerel
# gelistirme ve demo icin localhost yeterlidir; baska bir makineden
# erisim gerekiyorsa bu bilerek ve kimlik dogrulamasiyla acilmalidir.
#
# SURUM SABITLEME: qdrant ve ollama onceden ":latest" kullaniyordu -
# bu, ayni docker-compose.yml'nin farkli gunlerde farkli surum cekmesine
# ve juri demosu sirasinda beklenmedik davranis degisikligine yol
# acabilirdi. requirements.txt ile ayni gerekce (bkz. oradaki not).

services:
  postgres:
    image: postgres:16
    container_name: katilimai-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-katilim}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-katilim_dev}
      POSTGRES_DB: ${POSTGRES_DB:-katilimai}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-katilim}"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    # v1.18.x, requirements.txt'teki qdrant-client==1.18.0 ile ayni
    # minor hatta - istemci/sunucu surum uyumsuzlugu riskini onler.
    image: qdrant/qdrant:v1.18.1
    container_name: katilimai-qdrant
    ports:
      - "127.0.0.1:6333:6333"   # REST API + dashboard
      - "127.0.0.1:6334:6334"   # gRPC
    volumes:
      - qdrantdata:/qdrant/storage

  ollama:
    # Yerel gelistirmede kurulu olan surumle ayni (winget ile kurulan
    # Ollama 0.32.5) - Docker'daki ve yereldeki davranis ayrisamasin.
    image: ollama/ollama:0.32.5
    container_name: katilimai-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollamadata:/root/.ollama

volumes:
  pgdata:
  qdrantdata:
  ollamadata:
