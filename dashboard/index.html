<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <!-- %BASE_URL% kullaniliyor: production /katilim-ai/ on ekiyle derleniyor,
         duz "/" ile baslayan yol GitHub Pages te kirik cikar. -->
    <link rel="icon" type="image/png" href="%BASE_URL%logo-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KatılımAI — Katılım Bankacılığı Ürün Zekâsı</title>
    <script>
      // 404.html'in sorgu parametresine kodladigi gercek yolu URL
      // cubugunda geri yazar. React Router mount olmadan ONCE calismali,
      // bu yuzden module script'ten once ve <head> icinde duruyor
      // (bkz. public/404.html - rafgraph/spa-github-pages deseni).
      (function (l) {
        if (l.search[1] === "/") {
          var decoded = l.search
            .slice(1)
            .split("&")
            .map(function (s) {
              return s.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
